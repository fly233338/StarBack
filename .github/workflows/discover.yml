name: StarBack Discover

on:
  watch:
    types: [started]
  schedule:
    - cron: "17 0 1 * *"

permissions:
  contents: read
  issues: write

jobs:
  discover:
    concurrency:
      group: starback-discover-${{ github.repository }}
      queue: max
    runs-on: ubuntu-latest
    steps:
      - name: Check out StarBack
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Discover repositories
        run: npm run discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
