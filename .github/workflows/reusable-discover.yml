name: StarBack Discover (Reusable)

on:
  workflow_call:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    concurrency:
      group: starback-discover-${{ github.repository }}
      queue: max
    runs-on: ubuntu-latest
    steps:
      - name: Check out StarBack engine
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .starback
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Discover repositories
        run: node .starback/scripts/discover.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
